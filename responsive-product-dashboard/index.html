<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="#" class="header-div">LOGO</a>
        <a href="#" class="header-div">Search</a>
        <a href="#" class="header-div">Profile</a>
        <a href="#" class="header-div">🛒</a>
    </header>

    <img src="images/amazone_home_image.jpg" alt="Banner" class="hero-banner">

    <nav>
        <div class="nav-div">All</div>
        <div class="nav-div">Mobiles</div>
        <div class="nav-div">Toys</div>
        <div class="nav-div">Fashion</div>
        <div class="nav-div">Books</div>
        <div class="nav-div">TV</div>
        <div class="nav-div">Sports</div>
        <div class="nav-div">Beauty</div>
        <div class="nav-div">Furniture</div>
        <div class="nav-div">Electronics</div>
    </nav>

    <main>
        <div class="product">
            <div class="name">Bed Sheets</div>
            <img src="images/bed-sheets.jpg" alt="Bed Sheets" class="product-image">
            <div class="price"><button>Buy</button> $20 <button>Add to Cart</button></div>
        </div>

        <div class="product">
            <div class="name">Chair</div>
            <img src="images/chair.jpg" alt="Chair" class="product-image">
            <div class="price"><button>Buy</button> $50 <button>Add to Cart</button></div>
        </div>

        <div class="product">
            <div class="name">Drawing Book</div>
            <img src="images/draw-book.jpg" alt="Drawing Book" class="product-image">
            <div class="price"><button>Buy</button> $5 <button>Add to Cart</button></div>
        </div>

        <div class="product">
            <div class="name">Ear Rings</div>
            <img src="images/ear-rings.jpg" alt="Ear Rings" class="product-image">
            <div class="price"><button>Buy</button> $100 <button>Add to Cart</button></div>
        </div>

        <div class="product">
            <div class="name">Hero Kit</div>
            <img src="images/hero_image.jpg" alt="Hero Kit" class="product-image">
            <div class="price"><button>Buy</button> $1000 <button>Add to Cart</button></div>
        </div>

        <div class="product">
            <div class="name">Washroom Kit</div>
            <img src="images/washroom-kit.jpg" alt="Washroom Kit" class="product-image">
            <div class="price"><button>Buy</button> $80 <button>Add to Cart</button></div>
        </div>
    </main>

    <footer>Copyright 2026</footer>
    
</body>
</html>
